# Database Configuration
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_db
# Credentials loaded from environment variables or application-local.properties
spring.datasource.username=${DB_USERNAME:erp_user}
spring.datasource.password=${DB_PASSWORD:erp_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# SQL Scripts - Disabled, using JPA auto-creation instead
spring.sql.init.mode=never

# Server Configuration
server.port=${SERVER_PORT:8081}

# Open-in-view disabled for better performance
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PROD_CHANGE_ME_IN_PROD_32BYTES}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Flyway (disabled by default; prod profile should set enabled=true and ddl-auto=validate)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true